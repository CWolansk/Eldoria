<section class="section generated-page generated-page-{{typeSlug}}">
  <header class="entity-hero {{typeToneClass}}">
    <div class="stack-sm">
      <p class="section-kicker">{{type}}</p>
      <h1>{{title}}</h1>
      {{metaTags}}
    </div>
    {{metaList}}
  </header>
  <div class="generated-content-grid">
    <article class="markdown-body">
      {{body}}
    </article>
    {{sidebar}}
  </div>
</section>
