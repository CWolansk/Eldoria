        body {
            margin: 0;

        #map {
            width: 100vw;
            height: 100vh;
        }
        #coordinate-display {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            font-family: monospace;
            font-size: 14px;
        }
        #coordinate-display h4 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #666;
        }
        #coordinate-display .coords {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
