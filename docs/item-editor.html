<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Editor - Add to Items.csv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        textarea,
        select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: none;
        }

        #output.show {
            display: block;
        }

        #csvOutput {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #4caf50;
            color: white;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.show {
            display: block;
        }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Item Editor</h1>
        <p class="subtitle">Add new items to Items.csv</p>

        <form id="itemForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="source">Source</label>
                    <input type="text" id="source" name="source" placeholder="e.g., DMG'14, TCE">
                </div>

                <div class="form-group">
                    <label for="page">Page</label>
                    <input type="text" id="page" name="page" placeholder="e.g., 150">
                </div>

                <div class="form-group">
                    <label for="rarity">Rarity</label>
                    <select id="rarity" name="rarity">
                        <option value="">Select rarity...</option>
                        <option value="common">Common</option>
                        <option value="uncommon">Uncommon</option>
                        <option value="rare">Rare</option>
                        <option value="very rare">Very Rare</option>
                        <option value="legendary">Legendary</option>
                        <option value="artifact">Artifact</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <input type="text" id="type" name="type" placeholder="e.g., wondrous item, weapon">
                </div>

                <div class="form-group">
                    <label for="attunement">Attunement</label>
                    <input type="text" id="attunement" name="attunement" placeholder="e.g., requires attunement">
                </div>

                <div class="form-group">
                    <label for="damage">Damage</label>
                    <input type="text" id="damage" name="damage" placeholder="e.g., 1d8 slashing">
                </div>

                <div class="form-group">
                    <label for="properties">Properties</label>
                    <input type="text" id="properties" name="properties" placeholder="e.g., finesse, light">
                </div>

                <div class="form-group">
                    <label for="mastery">Mastery</label>
                    <input type="text" id="mastery" name="mastery">
                </div>

                <div class="form-group">
                    <label for="weight">Weight</label>
                    <input type="text" id="weight" name="weight" placeholder="e.g., 3 lb.">
                </div>

                <div class="form-group">
                    <label for="value">Value</label>
                    <input type="text" id="value" name="value" placeholder="e.g., 400 gp">
                </div>

                <div class="form-group full-width">
                    <label for="text">Description/Text *</label>
                    <textarea id="text" name="text" required placeholder="Enter the full item description here..."></textarea>
                    <span class="help-text">Full description of the item's properties and effects</span>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-primary" id="generateBtn">Generate CSV Line</button>
                <button type="button" class="btn-secondary" id="clearBtn">Clear Form</button>
            </div>
        </form>

        <div id="output">
            <h3>CSV Output:</h3>
            <div id="csvOutput"></div>
            <button class="copy-btn" id="copyBtn">📋 Copy to Clipboard</button>
            <p class="help-text" style="margin-top: 15px;">Copy this line and paste it at the end of your Items.csv file</p>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // CSV field order matching the header
        const FIELD_ORDER = [
            'name', 'source', 'page', 'rarity', 'type', 'attunement', 
            'damage', 'properties', 'mastery', 'weight', 'value', 'text'
        ];

        // Escape CSV field (handle quotes and commas)
        function escapeCSV(value) {
            if (value === null || value === undefined) {
                return '""';
            }
            
            value = String(value);
            
            // Replace any existing double quotes with double-double quotes
            value = value.replace(/"/g, '""');
            
            // Always wrap in quotes for consistency with the existing CSV
            return '"' + value + '"';
        }

        // Generate CSV line
        function generateCSVLine(formData) {
            const values = FIELD_ORDER.map(field => {
                const value = formData[field] || '';
                return escapeCSV(value);
            });
            
            return values.join(',');
        }

        // Generate output (called by button click)
        function generateOutput() {
            console.log('Generate button clicked');
            
            const formData = {};
            
            // Collect form data from each field
            FIELD_ORDER.forEach(field => {
                const element = document.getElementById(field);
                if (element) {
                    formData[field] = element.value.trim();
                    console.log(field + ':', element.value);
                }
            });
            
            // Validate required fields
            if (!formData.name || !formData.text) {
                alert('Please fill in the required fields: Name and Text');
                return;
            }
            
            console.log('Form data:', formData);
            
            // Generate CSV line
            const csvLine = generateCSVLine(formData);
            console.log('CSV line generated:', csvLine);
            
            // Display output
            const outputDiv = document.getElementById('output');
            const csvOutputDiv = document.getElementById('csvOutput');
            
            if (csvOutputDiv && outputDiv) {
                csvOutputDiv.textContent = csvLine;
                outputDiv.style.display = 'block';
                outputDiv.classList.add('show');
                
                // Scroll to output
                setTimeout(() => {
                    outputDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
                
                showNotification('CSV line generated successfully!');
                console.log('Output displayed');
            } else {
                console.error('Output divs not found');
            }
        }

        // Clear form
        function clearForm() {
            console.log('Clear button clicked');
            document.getElementById('itemForm').reset();
            const outputDiv = document.getElementById('output');
            outputDiv.style.display = 'none';
            outputDiv.classList.remove('show');
        }

        // Copy to clipboard
        function copyToClipboard() {
            console.log('Copy button clicked');
            const csvText = document.getElementById('csvOutput').textContent;
            
            navigator.clipboard.writeText(csvText).then(() => {
                showNotification('Copied to clipboard!');
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = csvText;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification('Copied to clipboard!');
            });
        }

        // Show notification
        function showNotification(message) {
            const notification = document.getElementById('notification');
            if (notification) {
                notification.textContent = message;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize event listeners when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeEventListeners);
        } else {
            initializeEventListeners();
        }

        function initializeEventListeners() {
            console.log('Initializing event listeners...');
            
            // Generate button
            const generateBtn = document.getElementById('generateBtn');
            if (generateBtn) {
                generateBtn.addEventListener('click', generateOutput);
                console.log('Generate button listener attached');
            } else {
                console.error('Generate button not found');
            }
            
            // Clear button
            const clearBtn = document.getElementById('clearBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', clearForm);
                console.log('Clear button listener attached');
            } else {
                console.error('Clear button not found');
            }
            
            // Copy button
            const copyBtn = document.getElementById('copyBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', copyToClipboard);
                console.log('Copy button listener attached');
            } else {
                console.error('Copy button not found');
            }
            
            // Auto-resize textarea
            const textArea = document.getElementById('text');
            if (textArea) {
                textArea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.max(120, this.scrollHeight) + 'px';
                });
                console.log('Textarea auto-resize listener attached');
            } else {
                console.error('Text area not found');
            }
            
            console.log('All event listeners initialized');
        }
    </script>
</body>
</html>
