<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC Reference - Eldoria Campaign</title>
    <style>
        :root {
            --background-primary: #ffffff;
            --background-secondary: #f5f5f5;
            --background-modifier-border: #ddd;
            --text-normal: #2e3338;
            --text-muted: #6c757d;
            --text-on-accent: #ffffff;
            --interactive-accent: #7c3aed;
            --interactive-accent-hover: #6d28d9;
            --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-primary: #1e1e1e;
                --background-secondary: #2d2d2d;
                --background-modifier-border: #464646;
                --text-normal: #dcddde;
                --text-muted: #a0a0a0;
                --interactive-accent: #8b5cf6;
                --interactive-accent-hover: #a78bfa;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-text); background-color: var(--background-primary); color: var(--text-normal); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; flex: 1; }
        header { text-align: center; padding: 3rem 1rem; background: linear-gradient(135deg, var(--interactive-accent) 0%, var(--interactive-accent-hover) 100%); color: var(--text-on-accent); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        header h1 { font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); }
        header p { font-size: 1.2rem; opacity: 0.95; }
        .back-link { display: inline-block; margin-bottom: 2rem; padding: 0.6rem 1.2rem; background-color: var(--interactive-accent); color: var(--text-on-accent); text-decoration: none; border-radius: 5px; font-weight: 500; transition: background-color 0.3s ease; }
        .back-link:hover { background-color: var(--interactive-accent-hover); }
        .search-box { width: 100%; padding: 1rem; margin-bottom: 2rem; font-size: 1rem; border: 2px solid var(--background-modifier-border); border-radius: 8px; background-color: var(--background-secondary); color: var(--text-normal); }
        .search-box:focus { outline: none; border-color: var(--interactive-accent); }
        .region-section { margin-bottom: 3rem; background-color: var(--background-secondary); border: 1px solid var(--background-modifier-border); border-radius: 8px; padding: 1.5rem; }
        .region-title { font-size: 1.8rem; margin-bottom: 1rem; color: var(--interactive-accent); border-bottom: 2px solid var(--background-modifier-border); padding-bottom: 0.5rem; }
        .location-group { margin-bottom: 1.5rem; }
        .location-name { font-size: 1.3rem; color: var(--text-normal); margin-bottom: 0.5rem; font-weight: 600; }
        .npc-list { list-style: none; padding-left: 1rem; }
        .npc-list li { padding: 0.5rem 1rem; margin-bottom: 0.25rem; background-color: var(--background-primary); border-radius: 5px; transition: all 0.3s ease; }
        .npc-list li:hover { transform: translateX(8px); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        .npc-list a { color: var(--interactive-accent); text-decoration: none; font-size: 1rem; font-weight: 500; }
        .npc-list a:hover { color: var(--interactive-accent-hover); }
        .no-results { text-align: center; padding: 3rem; color: var(--text-muted); font-style: italic; }
        .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
        footer { text-align: center; padding: 2rem; background-color: var(--background-secondary); border-top: 1px solid var(--background-modifier-border); color: var(--text-muted); margin-top: auto; }
        @media (max-width: 768px) { header h1 { font-size: 2rem; } header p { font-size: 1rem; } .region-title { font-size: 1.5rem; } .location-name { font-size: 1.1rem; } }
    </style>
</head>
<body>
    <header>
        <h1>🧙‍♂️ NPC Reference</h1>
        <p>All the characters you've met in Eldoria</p>
    </header>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Campaign Hub</a>
        
        <input type="text" id="searchBox" class="search-box" placeholder="Search for NPCs by name or location...">
        
        <div id="npcContainer" class="loading">Loading NPCs...</div>
    </div>
    <footer>
        <p>&copy; 2025 Eldoria Campaign | Powered by D&D 5th Edition</p>
    </footer>

    <script>
        // Load NPC data from automatically generated index
        let npcData = null;

        // Fetch the NPC index JSON file
        async function loadNPCIndex() {
            try {
                const response = await fetch('npc-index.json');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Failed to load NPC index:', error);
                return null;
            }
        }

        // Render NPCs
        function renderNPCs(indexData) {
            const container = document.getElementById('npcContainer');
            container.innerHTML = '';

            if (!indexData || Object.keys(indexData).length === 0) {
                container.innerHTML = '<div class="no-results">No NPCs found. Run <code>node generate-index.js</code> to generate the index.</div>';
                return;
            }

            let hasNPCs = false;

            for (const [region, locations] of Object.entries(indexData)) {
                const regionSection = document.createElement('div');
                regionSection.className = 'region-section';
                regionSection.dataset.region = region;

                const regionTitle = document.createElement('h2');
                regionTitle.className = 'region-title';
                regionTitle.textContent = region;
                regionSection.appendChild(regionTitle);

                let regionHasNPCs = false;

                for (const [location, locationData] of Object.entries(locations)) {
                    if (locationData.npcs && locationData.npcs.length > 0) {
                        regionHasNPCs = true;
                        hasNPCs = true;

                        const locationGroup = document.createElement('div');
                        locationGroup.className = 'location-group';
                        locationGroup.dataset.location = location;

                        const locationName = document.createElement('h3');
                        locationName.className = 'location-name';
                        locationName.textContent = location;
                        locationGroup.appendChild(locationName);

                        const npcList = document.createElement('ul');
                        npcList.className = 'npc-list';

                        locationData.npcs.forEach(npc => {
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.textContent = npc.name;
                            a.href = locationData.basePath + npc.file;
                            a.dataset.npcName = npc.name.toLowerCase();
                            li.appendChild(a);
                            npcList.appendChild(li);
                        });

                        locationGroup.appendChild(npcList);
                        regionSection.appendChild(locationGroup);
                    }
                }

                if (regionHasNPCs) {
                    container.appendChild(regionSection);
                }
            }

            if (!hasNPCs) {
                container.innerHTML = '<div class="no-results">No NPCs found.</div>';
            }
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const regions = document.querySelectorAll('.region-section');

            regions.forEach(region => {
                const locations = region.querySelectorAll('.location-group');
                let regionHasVisible = false;

                locations.forEach(location => {
                    const npcs = location.querySelectorAll('.npc-list li');
                    let locationHasVisible = false;

                    npcs.forEach(npc => {
                        const npcLink = npc.querySelector('a');
                        const npcName = npcLink.dataset.npcName;
                        const locationName = location.dataset.location.toLowerCase();

                        if (npcName.includes(searchTerm) || locationName.includes(searchTerm)) {
                            npc.style.display = '';
                            locationHasVisible = true;
                        } else {
                            npc.style.display = 'none';
                        }
                    });

                    location.style.display = locationHasVisible ? '' : 'none';
                    if (locationHasVisible) regionHasVisible = true;
                });

                region.style.display = regionHasVisible ? '' : 'none';
            });
        });

        // Initialize - load and render NPCs
        async function init() {
            npcData = await loadNPCIndex();
            renderNPCs(npcData);
        }

        init();
    </script>
</body>
</html>
