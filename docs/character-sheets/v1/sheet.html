<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eldoria Character Sheet</title>
  <script src="../../site-shell.js"></script>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">

      id="site-nav"
      data-current="players"
      data-base-path="../../"
    ></div>

          <p class="section-kicker">Players</p>

          <button class="button" type="button" data-open-builder disabled>Open Builder</button>
          <button class="button button-quiet" type="button" data-reload-sheet disabled>Reload</button>

      </header>
      <div id="sheet-root"></div>
    </main>
  </div>
