<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Reference - Eldoria Campaign</title>
    <style>
        :root {
            --background-primary: #ffffff;
            --background-secondary: #f5f5f5;
            --background-modifier-border: #ddd;
            --text-normal: #2e3338;
            --text-muted: #6c757d;
            --text-on-accent: #ffffff;
            --interactive-accent: #7c3aed;
            --interactive-accent-hover: #6d28d9;
            --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-primary: #1e1e1e;
                --background-secondary: #2d2d2d;
                --background-modifier-border: #464646;
                --text-normal: #dcddde;
                --text-muted: #a0a0a0;
                --interactive-accent: #8b5cf6;
                --interactive-accent-hover: #a78bfa;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-text); background-color: var(--background-primary); color: var(--text-normal); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; flex: 1; }
        header { text-align: center; padding: 3rem 1rem; background: linear-gradient(135deg, var(--interactive-accent) 0%, var(--interactive-accent-hover) 100%); color: var(--text-on-accent); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        header h1 { font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); }
        header p { font-size: 1.2rem; opacity: 0.95; }
        .back-link { display: inline-block; margin-bottom: 2rem; padding: 0.6rem 1.2rem; background-color: var(--interactive-accent); color: var(--text-on-accent); text-decoration: none; border-radius: 5px; font-weight: 500; transition: background-color 0.3s ease; }
        .back-link:hover { background-color: var(--interactive-accent-hover); }
        .search-box { width: 100%; padding: 1rem; margin-bottom: 2rem; font-size: 1rem; border: 2px solid var(--background-modifier-border); border-radius: 8px; background-color: var(--background-secondary); color: var(--text-normal); }
        .search-box:focus { outline: none; border-color: var(--interactive-accent); }
        .region-section { margin-bottom: 3rem; background-color: var(--background-secondary); border: 1px solid var(--background-modifier-border); border-radius: 8px; padding: 1.5rem; }
        .region-title { font-size: 1.8rem; margin-bottom: 1rem; color: var(--interactive-accent); border-bottom: 2px solid var(--background-modifier-border); padding-bottom: 0.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .region-title:hover { color: var(--interactive-accent-hover); }
        .toggle-icon { font-size: 1.2rem; transition: transform 0.3s ease; }
        .toggle-icon.collapsed { transform: rotate(-90deg); }
        .location-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .location-card { background-color: var(--background-primary); border: 1px solid var(--background-modifier-border); border-radius: 8px; padding: 1rem; transition: all 0.3s ease; }
        .location-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15); border-color: var(--interactive-accent); }
        .location-card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-normal); }
        .location-card a { color: var(--interactive-accent); text-decoration: none; font-weight: 500; }
        .location-card a:hover { color: var(--interactive-accent-hover); }
        .sub-locations { margin-top: 0.5rem; padding-left: 1rem; font-size: 0.9rem; }
        .sub-locations li { margin-bottom: 0.25rem; }
        .sub-locations a { color: var(--text-muted); }
        .sub-locations a:hover { color: var(--interactive-accent); }
        .no-results { text-align: center; padding: 3rem; color: var(--text-muted); font-style: italic; }
        footer { text-align: center; padding: 2rem; background-color: var(--background-secondary); border-top: 1px solid var(--background-modifier-border); color: var(--text-muted); margin-top: auto; }
        @media (max-width: 768px) { header h1 { font-size: 2rem; } header p { font-size: 1rem; } .region-title { font-size: 1.5rem; } .location-grid { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="site-assets/public-site.css">
</head>
<body class="docs-page reference-page">
    <header class="site-header">
        <a class="site-title" href="index.html">Eldoria</a>
        <nav>
            <a href="search.html">Search</a>
            <a href="WorldMap.html">Map</a>
            <a href="npc-reference.html">NPCs</a>
            <a href="location-reference.html">Locations</a>
        </nav>
    </header>
    <header>
        <h1>Location Reference</h1>
        <p>Explore the towns, cities, and regions of Eldoria</p>
    </header>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Campaign Hub</a>
        
        <input type="text" id="searchBox" class="search-box" placeholder="Search for locations...">
        
        <div id="locationContainer"></div>
    </div>
    <footer>
        <p>&copy; 2025 Eldoria Campaign | Powered by D&D 5th Edition</p>
    </footer>

    <script>
        // Load location data from automatically generated index
        let locationData = null;

        // Fetch the location index JSON file
        async function loadLocationIndex() {
            try {
                const response = await fetch('location-index.json');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Failed to load location index:', error);
                return null;
            }
        }

        // Fallback structure for reference
        const fallbackLocationStructure = {
            'Crestfall Kingdom': {
                basePath: 'Public/World/Crestfall/',
                locations: {
                    'Highreach': {
                        file: 'Highreach.html',
                        subLocations: [
                            { name: 'Highreach Adventurers Guild', file: 'Highreach Adventurers Guild.html' },
                            { name: 'HighReach Merchants Guild', file: 'HighReach Merchants Guild.html' },
                            { name: 'Highreach Mines', file: 'Highreach Mines.html' },
                            { name: 'Sturdy Mugg', file: 'Sturdy Mugg.html' },
                            { name: 'Target by Tradewind', file: 'Target by Tradewind.html' },
                            { name: 'The Arcane Enclave', file: 'The Arcane Enclave.html' },
                            { name: 'The Dragons Breath Forge', file: 'The Dragons Breath Forge.html' }
                        ]
                    },
                    'Ardenville': {
                        file: 'Ardenville.html',
                        subLocations: [
                            { name: 'Lake Arden', file: 'Lake Arden.html' },
                            { name: 'Steelshapers Forge', file: 'Steelshapers Forge.html' },
                            { name: 'The Enchanted Trinket', file: 'The Enchanted Trinket.html' }
                        ]
                    },
                    'Fairfield': {
                        file: 'Fairfield.html',
                        subLocations: [
                            { name: 'Forgefires Armaments', file: 'Forgefires Armaments.html' },
                            { name: 'Starspells Wonders', file: 'Starspells Wonders.html' }
                        ]
                    },
                    'Hillcrest': {
                        file: 'Hillcrest.html',
                        subLocations: [
                            { name: 'Hammerstrikes Weapons', file: 'Hammerstrikes Weapons.html' },
                            { name: 'Nightwhispers Potions and Scrolls', file: 'Nightwhispers Potions and Scrolls.html' }
                        ]
                    },
                    'Stonehaven': {
                        file: 'Stonehaven.html',
                        subLocations: [
                            { name: 'Blackwood Forest', file: 'Blackwood Forest.html' },
                            { name: 'Ironforge Smithy', file: 'Ironforge Smithy.html' },
                            { name: 'Marlas Gear', file: 'Marlas Gear.html' },
                            { name: 'Mystic Wares', file: 'Mystic Wares.html' },
                            { name: 'Stonehaven Supplies', file: 'Stonehaven Supplies.html' },
                            { name: 'Stones Herbs', file: 'Stones Herbs.html' }
                        ]
                    }
                }
            },
            'Ironpeak Mountains': {
                basePath: 'Public/World/Ironpeak Mountains/',
                locations: {
                    'Forgepeak': { file: 'ForgePeak.html', subLocations: [] },
                    'Gemstone Hollow': { file: 'Gemstone Hollow.html', subLocations: [] },
                    'Ironroot': { file: 'Ironroot.html', subLocations: [] },
                    'Steamhammer': { file: 'Steamhammer.html', subLocations: [] },
                    'Stoneforge': { file: 'Stoneforge.html', subLocations: [] },
                    'Cannibal Camp': { file: 'Mountain Tribes.html', subLocations: [] }
                }
            },
            'Silverleaf Lands': {
                basePath: 'Public/World/Silverleaf Lands/',
                locations: {
                    'Frostglade': { file: 'FrostGlade.html', subLocations: [] },
                    'Moonshade': { file: 'Moonshade.html', subLocations: [] },
                    'Serenity Hollow': { file: 'Serenity Hollow.html', subLocations: [] },
                    'Stardew': { file: 'Stardew.html', subLocations: [] },
                    'Starfall': { file: 'Starfall.html', subLocations: [] }
                }
            },
            'Orcish Wastes': {
                basePath: 'Public/World/Orcish Wastes/',
                locations: {
                    'Orc Capitol': { file: 'Orc Capitol.html', subLocations: [] },
                    'Orc Town B': { file: 'Orc City B.html', subLocations: [] },
                    'Orc Town C': { file: 'Orc City C.html', subLocations: [] },
                    'Red Dune Desert': { file: 'Red Dune Desert.html', subLocations: [] },
                    'Sand Dragon Valley': { file: 'Sand Dragon Valley.html', subLocations: [] },
                    'Witchs Bog': { file: 'Witchs Bog.html', subLocations: [] },
                    'Wizards Tower': { file: 'Wizards Tower.html', subLocations: [] }
                }
            },
            'Groups & Organizations': {
                basePath: 'Public/World/Groups/',
                locations: {
                    'Adventurers Guild': { file: 'Adventurers Guild.html', subLocations: [] },
                    'Exterminators Guild': { file: 'Exterminators Guild.html', subLocations: [] },
                    'Foundation': { file: 'Foundation.html', subLocations: [] },
                    'Merchants Guild': { file: 'Merchants Guild.html', subLocations: [] }
                }
            }
        };

        // Render locations
        function renderLocations(indexData) {
            const container = document.getElementById('locationContainer');
            container.innerHTML = '';

            if (!indexData || Object.keys(indexData).length === 0) {
                container.innerHTML = '<div class="no-results">No locations found. Run <code>node generate-index.js</code> to generate the index.</div>';
                return;
            }

            for (const [region, data] of Object.entries(indexData)) {
                const regionSection = document.createElement('div');
                regionSection.className = 'region-section';
                regionSection.dataset.region = region.toLowerCase();

                const regionTitle = document.createElement('h2');
                regionTitle.className = 'region-title';
                regionTitle.innerHTML = `${region} <span class="toggle-icon">▼</span>`;
                regionTitle.onclick = () => toggleRegion(regionSection);
                regionSection.appendChild(regionTitle);

                const locationGrid = document.createElement('div');
                locationGrid.className = 'location-grid';

                for (const [locationName, locationData] of Object.entries(data.locations)) {
                    const locationCard = document.createElement('div');
                    locationCard.className = 'location-card';
                    locationCard.dataset.location = locationName.toLowerCase();

                    const heading = document.createElement('h3');
                    const link = document.createElement('a');
                    link.textContent = locationName;
                    link.href = `${data.basePath}${locationName}/${locationData.file}`;
                    heading.appendChild(link);
                    locationCard.appendChild(heading);

                    if (locationData.subLocations && locationData.subLocations.length > 0) {
                        const subList = document.createElement('ul');
                        subList.className = 'sub-locations';
                        locationData.subLocations.forEach(sub => {
                            const li = document.createElement('li');
                            const subLink = document.createElement('a');
                            subLink.textContent = sub.name;
                            subLink.href = `${data.basePath}${locationName}/${sub.file}`;
                            li.appendChild(subLink);
                            subList.appendChild(li);
                        });
                        locationCard.appendChild(subList);
                    }

                    locationGrid.appendChild(locationCard);
                }

                regionSection.appendChild(locationGrid);
                container.appendChild(regionSection);
            }
        }

        // Toggle region visibility
        function toggleRegion(regionSection) {
            const grid = regionSection.querySelector('.location-grid');
            const icon = regionSection.querySelector('.toggle-icon');
            
            if (grid.style.display === 'none') {
                grid.style.display = 'grid';
                icon.classList.remove('collapsed');
            } else {
                grid.style.display = 'none';
                icon.classList.add('collapsed');
            }
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const regions = document.querySelectorAll('.region-section');

            regions.forEach(region => {
                const cards = region.querySelectorAll('.location-card');
                let regionHasVisible = false;

                cards.forEach(card => {
                    const locationName = card.dataset.location;
                    const allText = card.textContent.toLowerCase();

                    if (allText.includes(searchTerm)) {
                        card.style.display = '';
                        regionHasVisible = true;
                    } else {
                        card.style.display = 'none';
                    }
                });

                const grid = region.querySelector('.location-grid');
                if (searchTerm && regionHasVisible) {
                    grid.style.display = 'grid';
                    region.querySelector('.toggle-icon').classList.remove('collapsed');
                }

                region.style.display = regionHasVisible || !searchTerm ? '' : 'none';
            });
        });

        // Initialize - load and render locations
        async function init() {
            locationData = await loadLocationIndex();
            renderLocations(locationData);
        }

        init();
    </script>
</body>
</html>
